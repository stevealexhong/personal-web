        new Function(src);
      } catch (e) {
        if (e && e.name === 'SyntaxError') {
          var m = String(e.message).replace(/^SyntaxError:\s*/, '');
          pushAt('error', 0, 'JS 语法错误：' + m);
        }
      }
    }
  }

  function runLint() {
    var code = editor.value;
    issues = [];

    if (code.length > LINT_LIMIT) {
      issues.push({
        severity: 'info', line: 1, col: 1, src: 'SYS',
        msg: '文件过大，已跳过格式检查（超过 ' + Math.round(LINT_LIMIT / 1000) + 'K 字符）'
      });
      finishLint();
      return;
    }

    if (code.trim()) {
      var starts = buildLineStarts(code);
      try {
        var blocks = lintHTML(code, starts, issues);
        for (var b = 0; b < blocks.length; b++) {
          var blk = blocks[b];
          if (blk.type === 'style') {
            lintCSS(blk.content, blk.contentPos, starts, issues);
          } else if (blk.type === 'script') {
            lintJS(blk.content, blk.contentPos, starts, issues, blk.isModule);
          }
        }
      } catch (err) {
        issues.push({
          severity: 'info', line: 1, col: 1, src: 'SYS',
          msg: '检查器内部错误：' + err.message
        });
      }
    }

    finishLint();
  }

  function finishLint() {
    issues.sort(function (a, b) {
      if (a.line !== b.line) return a.line - b.line;
      if (a.col !== b.col) return a.col - b.col;
      return SEV_RANK[a.severity] - SEV_RANK[b.severity];
    });

    if (issues.length > MAX_ISSUES) issues.length = MAX_ISSUES;

    renderIssues();
    applyIssueMarks();
  }

  function applyIssueMarks() {
    issueLineMap = Object.create(null);
    for (var i = 0; i < issues.length; i++) {
      var it = issues[i];
      if (it.src === 'SYS') continue;
      var cur = issueLineMap[it.line];
      if (cur === undefined || SEV_RANK[it.severity] < SEV_RANK[cur]) {
        issueLineMap[it.line] = it.severity;
      }
    }
    updateMeta();
  }

  var SEV_ICON = { error: '✕', warning: '!', info: 'i' };

  function renderIssues() {
    var errs = 0, warns = 0, infos = 0;
    for (var i = 0; i < issues.length; i++) {
      var s = issues[i].severity;
      if (s === 'error') errs++;
      else if (s === 'warning') warns++;
      else infos++;
    }

    var html = '';
    if (!issues.length) {
      html = '<div class="issue-empty">✓ 未发现问题，代码看起来不错</div>';
    } else {
      for (var k = 0; k < issues.length; k++) {
        var it = issues[k];
        html += '<div class="issue-item sev-' + it.severity + '"' +
                  ' data-line="' + it.line + '" data-col="' + it.col + '">' +
                  '<span class="ii-icon">' + SEV_ICON[it.severity] + '</span>' +
                  '<span class="ii-line">' + it.line + ':' + it.col + '</span>' +
                  '<span class="ii-src">' + it.src + '</span>' +
                  '<span class="ii-msg">' + escapeHtml(it.msg) + '</span>' +
                '</div>';
      }
    }
    issueList.innerHTML = html;

    var parts = [];
    if (errs)  parts.push(errs + ' 个错误');
    if (warns) parts.push(warns + ' 个警告');
    if (infos) parts.push(infos + ' 个提示');

    issueSummary.textContent = parts.length ? parts.join(' · ') : '未发现问题';
    issueSummary.className = errs ? 'has-error' : (warns ? 'has-warning' : 'ok');

    var total = errs + warns + infos;
    btnLint.textContent = total ? '⚑ 检查 (' + total + ')' : '⚑ 检查';
    btnLint.classList.toggle('lint-error', errs > 0);
    btnLint.classList.toggle('lint-warning', errs === 0 && warns > 0);
    btnLint.classList.toggle('lint-ok', errs === 0 && warns === 0);
  }

  function gotoLineCol(line, col) {
    var text = editor.value;
    var starts = buildLineStarts(text);
    var lineStart = starts[line - 1];
    if (lineStart === undefined) lineStart = text.length;
    var pos = Math.min(text.length, Math.max(0, lineStart + (col - 1)));

    editor.focus();
    editor.setSelectionRange(pos, pos);
    scrollToLine(line);
  }

  function scheduleLint() {
    clearTimeout(lintTimer);
    lintTimer = setTimeout(runLint, LINT_DELAY);
  }

  btnLint.addEventListener('click', function () {
    if (issuePanel.classList.contains('show')) {
      issuePanel.classList.remove('show');
    } else {
      issuePanel.classList.add('show');
      runLint();
    }
  });

  btnRecheck.addEventListener('click', function () {
    runLint();
    toast('已重新检查');
  });

  ipClose.addEventListener('click', function () {
    issuePanel.classList.remove('show');
    editor.focus();
  });

  issueList.addEventListener('click', function (e) {
    var item = e.target.closest ? e.target.closest('.issue-item') : null;
    if (!item) return;
    var line = parseInt(item.getAttribute('data-line'), 10);
    var col  = parseInt(item.getAttribute('data-col'), 10) || 1;
    if (!isNaN(line)) gotoLineCol(line, col);
  });

  /* =========================================================
     十三、【核心新增】悬停联动：预览 DOM ↔ 源码 双向定位
     ========================================================= */

  /* ---------- 13.1 源码标签索引 ---------- */
  function buildTagIndex(code) {
    var tags = [];
    var i = 0, n = code.length;

    while (i < n) {
      var lt = code.indexOf('<', i);
      if (lt === -1) break;

      // 注释
      if (code.startsWith('<!--', lt)) {
        var ce = code.indexOf('-->', lt + 4);
        i = (ce === -1) ? n : ce + 3;
        continue;
      }
      // 声明 <!DOCTYPE ...>
      if (code.charAt(lt + 1) === '!') {
        var de = code.indexOf('>', lt);
        i = (de === -1) ? n : de + 1;
        continue;
      }

      // 结束标签
      if (code.charAt(lt + 1) === '/') {
        var cm = /^<\/\s*([a-zA-Z][a-zA-Z0-9:_-]*)\s*>/.exec(code.slice(lt));
        if (!cm) { i = lt + 1; continue; }
        tags.push({
          name: cm[1].toLowerCase(),
          start: lt,
          end: lt + cm[0].length,
          isClose: true,
          selfClose: false
        });
        i = lt + cm[0].length;
        continue;
      }

      // 开始标签
      if (/[a-zA-Z]/.test(code.charAt(lt + 1))) {
        var tag = parseTag(code, lt);
        if (!tag) { i = lt + 1; continue; }

        var lname = tag.name.toLowerCase();
        tags.push({
          name: lname,
          start: lt,
          end: tag.end,
          isClose: false,
          selfClose: !!tag.selfClose
        });

        // script / style：跳过内容，只记录闭合标签
        if (lname === 'script' || lname === 'style') {
          var closeRe = new RegExp('<\\/' + lname + '\\s*>', 'i');
          var cMatch = closeRe.exec(code.slice(tag.end));
          if (cMatch) {
            var cStart = tag.end + cMatch.index;
            tags.push({
              name: lname,
              start: cStart,
              end: cStart + cMatch[0].length,
              isClose: true,
              selfClose: false
            });
            i = cStart + cMatch[0].length;
          } else {
            i = n;
          }
          continue;
        }

        i = tag.end;
        continue;
      }

      i = lt + 1;
    }

    for (var k = 0; k < tags.length; k++) tags[k].idx = k;
    return tags;
  }

  /* ---------- 13.2 找某个开始标签对应的整段源码范围 ---------- */
  function findElementRange(tags, idx) {
    var tag = tags[idx];
    if (!tag) return null;

    var result = { start: tag.start, end: tag.end };

    if (tag.selfClose) return result;
    if (VOID_ELEMENTS[tag.name]) return result;

    var depth = 0;
    for (var i = idx + 1; i < tags.length; i++) {
      var t = tags[i];
      if (t.isClose) {
        if (t.name === tag.name) {
          if (depth === 0) {
            result.end = t.end;
            return result;
          }
          depth--;
        }
      } else if (!t.selfClose && !VOID_ELEMENTS[t.name]) {
        if (t.name === tag.name) depth++;
      }
    }
    return result;   // 未找到闭合标签，只高亮开始标签
  }

  /* ---------- 13.3 DOM 元素 ↔ 源码标签 映射 ---------- */
  var tagIndexCache = [];       // 源码标签数组
  var domTagMap = null;         // Map<Element, tag>
  var clickableCache = null;    // WeakMap<Element, boolean>

  function mapDomToTags(doc, tags) {
    var map = new Map();
    if (!doc || !doc.documentElement) return map;

    // 按文档顺序收集所有元素
    var all = [];
    (function walk(node) {
      var c = node.firstElementChild;
      while (c) {
        all.push(c);
        walk(c);
        c = c.nextElementSibling;
      }
    })(doc.documentElement);

    var ti = 0;
    for (var i = 0; i < all.length; i++) {
      var el = all[i];
      var name = el.tagName ? el.tagName.toLowerCase() : '';
      if (!name) continue;

      // 在源码标签里向后找同名的开始标签（限制前瞻窗口，避免错位失控）
      var found = -1;
      var limit = Math.min(tags.length, ti + 60);
      for (var k = ti; k < limit; k++) {
        if (!tags[k].isClose && tags[k].name === name) { found = k; break; }
      }
      if (found !== -1) {
        map.set(el, tags[found]);
        ti = found + 1;
      }
    }
    return map;
  }

  function rebuildHoverIndex() {
    try {
      tagIndexCache = buildTagIndex(editor.value);
      clickableCache = new WeakMap();
      domTagMap = mapDomToTags(iframe.contentDocument, tagIndexCache);
    } catch (e) {
      tagIndexCache = [];
      domTagMap = new Map();
      clickableCache = new WeakMap();
    }
  }

  /* ---------- 13.4 判断元素是否“可点击” ---------- */
  function computeClickable(el, win) {
    var tag = el.tagName ? el.tagName.toLowerCase() : '';
    if (!tag || tag === 'body' || tag === 'html') return false;

    if (tag === 'a') return el.hasAttribute('href');
    if (tag === 'button' || tag === 'select' || tag === 'textarea' ||
        tag === 'summary' || tag === 'label' || tag === 'option') return true;
    if (tag === 'input') {
      var t = (el.getAttribute('type') || 'text').toLowerCase();
      return t !== 'hidden';
    }
    if (el.hasAttribute('onclick')) return true;

    var role = (el.getAttribute('role') || '').toLowerCase();
    if (role === 'button' || role === 'link' || role === 'tab' ||
        role === 'menuitem' || role === 'checkbox' || role === 'radio') return true;

    var ti = el.getAttribute('tabindex');
    if (ti !== null && ti !== '-1') return true;

    try {
      if (win && win.getComputedStyle(el).cursor === 'pointer') return true;
    } catch (e) { /* ignore */ }

    return false;
  }

  function isClickableEl(el, win) {
    if (!el || el.nodeType !== 1) return false;
    if (!clickableCache) clickableCache = new WeakMap();
    if (clickableCache.has(el)) return clickableCache.get(el);
    var r = computeClickable(el, win);
    clickableCache.set(el, r);
    return r;
  }

  function findClickableAncestor(el, doc) {
    var win = iframe.contentWindow;
    var node = el;
    var guard = 0;
    while (node && node.nodeType === 1 && guard++ < 24) {
      if (node === doc.body || node === doc.documentElement) return null;
      if (isClickableEl(node, win)) return node;
      node = node.parentElement;
    }
    return null;
  }

  /* ---------- 13.5 预览区虚线描边 ---------- */
  var hoverEl = null;
  var outlineEl = null;

  function setImp(el, prop, val) {
    try { el.style.setProperty(prop, val, 'important'); }
    catch (e) { el.style[prop] = val; }
  }

  function ensureOutline(doc) {
    if (outlineEl && outlineEl.isConnected && outlineEl.ownerDocument === doc) {
      return outlineEl;
    }
    outlineEl = doc.createElement('div');
    outlineEl.setAttribute('data-hover-outline', '1');
    setImp(outlineEl, 'position', 'fixed');
    setImp(outlineEl, 'pointer-events', 'none');
    setImp(outlineEl, 'z-index', '2147483647');
    setImp(outlineEl, 'border', '2px dashed #4c8dff');
    setImp(outlineEl, 'border-radius', '3px');
    setImp(outlineEl, 'background', 'rgba(76,141,255,.10)');
    setImp(outlineEl, 'box-shadow', '0 0 0 1px rgba(76,141,255,.45), 0 0 14px rgba(76,141,255,.45)');
    setImp(outlineEl, 'box-sizing', 'border-box');
    setImp(outlineEl, 'margin', '0');
    setImp(outlineEl, 'padding', '0');
    setImp(outlineEl, 'transition', 'left .06s ease-out, top .06s ease-out, width .06s ease-out, height .06s ease-out');
    setImp(outlineEl, 'display', 'block');
    setImp(outlineEl, 'left', '0px');
    setImp(outlineEl, 'top', '0px');
    setImp(outlineEl, 'width', '0px');
    setImp(outlineEl, 'height', '0px');

    var host = doc.body || doc.documentElement;
    if (host) host.appendChild(outlineEl);
    return outlineEl;
  }

  function repositionOutline() {
    if (!hoverEl) return;
    var doc = iframe.contentDocument;
    if (!doc || !hoverEl.isConnected) { clearHover(); return; }

    var ov = ensureOutline(doc);
    var r = hoverEl.getBoundingClientRect();
    ov.style.setProperty('left',   r.left + 'px', 'important');
    ov.style.setProperty('top',    r.top + 'px', 'important');
    ov.style.setProperty('width',  Math.max(0, r.width) + 'px', 'important');
    ov.style.setProperty('height', Math.max(0, r.height) + 'px', 'important');
  }

  function hideOutline() {
    if (outlineEl && outlineEl.isConnected) {
      try { outlineEl.parentNode.removeChild(outlineEl); } catch (e) {}
    }
    outlineEl = null;
  }

  /* ---------- 13.6 预览区 DOM → 源码：鼠标移动 ---------- */
  var movePending = false;
  var lastMoveEvt = null;

  function handleInnerMove(e) {
    lastMoveEvt = e;
    if (movePending) return;
    movePending = true;
    requestAnimationFrame(function () {
      movePending = false;
      processInnerMove(lastMoveEvt);
    });
  }

  function processInnerMove(e) {
    if (!e) return;
    if (!hoverToggle.checked) { clearHover(); return; }

    var doc = iframe.contentDocument;
    if (!doc) return;

    var t = e.target;
    if (!t) { clearHover(); return; }
    if (t.nodeType !== 1) t = t.parentElement;
    if (!t || t.nodeType !== 1) { clearHover(); return; }

    var clickable = findClickableAncestor(t, doc);
    if (clickable === hoverEl) {
      if (hoverEl) repositionOutline();
      return;
    }
    setHover(clickable);
  }

  function setHover(el) {
    hideOutline();
    hoverEl = el;
    clearCodeHighlight();

    if (!el) return;

    repositionOutline();

    // 找到源码标签
    if (!domTagMap) return;
    var tag = domTagMap.get(el);
    if (!tag) return;

    var range = findElementRange(tagIndexCache, tag.idx);
    if (!range) return;

    showCodeHighlight(range.start, range.end);
  }

  function clearHover() {
    hoverEl = null;
    hideOutline();
    clearCodeHighlight();
  }

  /* ---------- 13.7 代码预览区：虚线框选中对应代码 ---------- */
  function measureWidth(text) {
    if (!text) return 0;
    cpMeasure.textContent = text;
    var w = cpMeasure.getBoundingClientRect().width;
    cpMeasure.textContent = '';
    return w;
  }

  function clearCodeHighlight() {
    if (codePreviewOverlay) codePreviewOverlay.innerHTML = '';
  }

  function showCodeHighlight(start, end) {
    if (!codePreviewOverlay) return;
    codePreviewOverlay.innerHTML = '';
    if (start == null || end == null || end <= start) return;

    var code = editor.value;
    if (start >= code.length) return;

    var starts = buildLineStarts(code);
    var lines = code.split('\n');

    var startLine = lineOfOffset(starts, start);
    var endLine = lineOfOffset(starts, Math.min(code.length - 1, Math.max(start, end - 1)));
    if (endLine - startLine > 200) endLine = startLine + 200;   // 安全上限

    // 先把目标滚进视野
    var topY = CP_PAD + startLine * CP_LINE_H;
    var botY = CP_PAD + (endLine + 1) * CP_LINE_H;
    var viewH = codePreviewScroll.clientHeight;
    var curTop = codePreviewScroll.scrollTop;

    if (topY < curTop + 16 || botY > curTop + viewH - 16) {
      var target = topY - Math.max(0, viewH / 3);
      if (target < 0) target = 0;
      codePreviewScroll.scrollTop = target;
      curTop = target;
    }

    var frag = document.createDocumentFragment();

    for (var L = startLine; L <= endLine && L < lines.length; L++) {
      var lineStart = starts[L];
      var lineText = lines[L] || '';
      var lineEnd = lineStart + lineText.length;

      var s = Math.max(start, lineStart);
      var e = Math.min(end, lineEnd);
      if (e < s) e = s;

      var colS = s - lineStart;
      var colE = e - lineStart;

      var x = CP_PAD + measureWidth(lineText.slice(0, colS));
      var w = measureWidth(lineText.slice(colS, colE));
      if (w < 7) w = 7;

      var y = CP_PAD + L * CP_LINE_H - curTop;

      if (y + CP_LINE_H < -20 || y > viewH + 20) continue;

      var box = document.createElement('div');
      box.className = 'cp-hl';
      box.style.left   = x + 'px';
      box.style.top    = y + 'px';
      box.style.width  = w + 'px';
      box.style.height = CP_LINE_H + 'px';
      frag.appendChild(box);
    }

    codePreviewOverlay.appendChild(frag);
  }

  /* 鼠标离开预览 iframe 时清理 */
  previewPane.addEventListener('mouseleave', function () { clearHover(); });
  codePreviewScroll.addEventListener('scroll', function () {
    // 代码预览区自身滚动时，重新按新的 scrollTop 绘制高亮
    if (hoverEl) {
      if (!domTagMap) return;
      var tag = domTagMap.get(hoverEl);
      if (!tag) return;
      var range = findElementRange(tagIndexCache, tag.idx);
      if (range) showCodeHighlight(range.start, range.end);
    }
  }, { passive: true });

  /* =========================================================
     十四、初始化
     ========================================================= */
  function init() {
    var savedZoom = NaN;
    try { savedZoom = parseFloat(localStorage.getItem(ZOOM_KEY)); } catch (e) {}
    if (isFinite(savedZoom) && savedZoom > 0) {
      zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, savedZoom));
    }
    applyZoom();

    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    editor.value = (saved !== null && saved !== '') ? saved : DEFAULT_CODE;

    issueLineMap = null;
    updateMeta();
    applyHighlight();
    markDirty(false);
    render();

    runLint();

    editor.focus();
    editor.setSelectionRange(0, 0);
    editor.scrollTop = 0;
    syncScroll();
  }

  window.addEventListener('beforeunload', saveNow);

  init();
})();
</script>
</body>
</html>
